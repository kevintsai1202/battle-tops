<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Tops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="overlay">
      <!-- 對戰 HUD：左玩家、右 CPU、中間比分 -->
      <div id="hud" hidden>
        <div class="panel" data-side="0">
          <div class="name"></div>
          <div class="rpm"><span class="val">0</span> RPM</div>
          <div class="bar spin"><i></i></div>
          <div class="label">BURST</div>
          <div class="bar burst"><i></i></div>
          <div class="label">必殺</div>
          <div class="bar special"><i></i></div>
          <div class="ready">必殺 READY ▶ SPACE</div>
        </div>
        <div class="score"><span class="s0">0</span><em>-</em><span class="s1">0</span><small>先取 3 分</small></div>
        <div class="panel" data-side="1">
          <div class="name"></div>
          <div class="rpm"><span class="val">0</span> RPM</div>
          <div class="bar spin"><i></i></div>
          <div class="label">BURST</div>
          <div class="bar burst"><i></i></div>
          <div class="label">必殺</div>
          <div class="bar special"><i></i></div>
          <div class="ready">必殺 READY</div>
        </div>
      </div>

      <div id="fx-layer"></div>
      <div id="banner"></div>

      <!-- 發射時機量表：外圈收縮，對準內圈時按下 -->
      <div id="launch" hidden>
        <div class="target"></div>
        <div class="closing"></div>
        <div class="hint">SPACE／點擊：在「ゴー」的瞬間發射！</div>
      </div>

      <!-- 必殺技 cut-in -->
      <div id="cutin" hidden>
        <div class="band"><div class="who"></div><div class="move"></div></div>
      </div>

      <section id="title" class="screen">
        <h1>BATTLE TOPS</h1>
        <p class="en">爆転バトル ・ 戰鬥陀螺</p>
        <p class="blink">クリックしてスタート ／ 點擊開始</p>
        <p class="note">請開啟聲音（建議戴耳機，3D 立體音效）</p>
      </section>

      <section id="select" class="screen" hidden>
        <h2>コマを選べ！<small>選擇你的陀螺（← → 選擇、Enter 決定）</small></h2>
        <div class="cards"></div>
      </section>

      <section id="result" class="screen" hidden>
        <h2 class="headline"></h2>
        <p class="final"></p>
        <button type="button" class="retry">もう一度！／再來一場</button>
      </section>

      <div id="audio-hint" hidden>🔊 クリックで音声ON／點擊畫面開啟聲音</div>
      <div id="help">WASD／方向鍵：推移陀螺　SPACE：必殺技　M：音樂開關</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
